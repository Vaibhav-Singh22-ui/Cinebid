<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0c0d12"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="url(#gold-grad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Film Reel & Gavel Golden Emblem -->
  <circle cx="32" cy="28" r="16" stroke="url(#gold-grad)" stroke-width="3" fill="#14161f"/>
  <circle cx="32" cy="28" r="5" fill="url(#gold-grad)"/>
  <circle cx="32" cy="18" r="2.5" fill="url(#gold-grad)"/>
  <circle cx="32" cy="38" r="2.5" fill="url(#gold-grad)"/>
  <circle cx="22" cy="28" r="2.5" fill="url(#gold-grad)"/>
  <circle cx="42" cy="28" r="2.5" fill="url(#gold-grad)"/>
  <!-- Gavel handle & head -->
  <path d="M20 50 L44 50" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round"/>
  <rect x="24" y="44" width="16" height="4" rx="2" fill="url(#gold-grad)"/>
